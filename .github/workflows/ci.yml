name: CI

# Validación automática en Pull Requests. No publica ni despliega nada.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, pruebas, build y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalación reproducible
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (src, server y functions)
        run: npm run typecheck

      - name: Pruebas unitarias e integración
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Auditoría de dependencias (moderate o superior)
        run: npm audit --audit-level=moderate

  e2e:
    name: Pruebas E2E (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar E2E contra el build de producción
        run: npm run test:e2e

      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
